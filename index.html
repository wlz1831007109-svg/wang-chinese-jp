 {id:"q3",type:"意味機能",question:"「门开着。」に最も近い説明はどれですか。",choices:["ドアを開けている最中","ドアが開いた状態が続いている","ドアを開けた経験がある","ドアを開けてもよい"],answer:1,explain:"「着」はここでは動作後の結果状態の持続を表します。「～ている」の進行用法とは分けます。",entry:"teiru"},
 {id:"q4",type:"誤用訂正",question:"情報を知っていると言いたいとき、「我认识这件事。」の自然な表現はどれですか。",choices:["这件事我知道。","这件事我会。","这件事我能。","这件事我可以。"],answer:0,explain:"事実・情報を知っている場合は「知道」が適切です。「认识」は人と面識があるなどの意味で使います。",entry:"shitteiru"},
 {id:"q5",type:"場面選択",question:"店員から袋を勧められて「袋は大丈夫です」と断る場面に合う表現は？",choices:["没关系。","不用袋子了。","我知道袋子。","袋子会。"],answer:1,explain:"申し出を断る「大丈夫です」は「不用了」などが自然です。「没关系」は謝罪への返答などに使います。",entry:"daijoubu"},
 {id:"q6",type:"語彙",question:"「今日は行けます。」のように、予定・条件上の可能を表す典型的な語は？",choices:["会","能","过","着"],answer:1,explain:"時間・予定・状況上の可能を述べる「能」が候補になります。「会」は習得技能や推測などの義項と区別します。",entry:"neng"},
 {id:"q7",type:"文法",question:"「中国へ行ったことがあります。」の経験を表す中国語は？",choices:["我去过中国。","我正在去中国。","我会去中国。","我在中国。"],answer:0,explain:"経験相は「过」で表せます。日本語の「～た」には過去の出来事など他の用法もあります。",entry:"ta"},
 {id:"q8",type:"会話表現",question:"相手の謝罪に「気にしないで、大丈夫」と返す表現として近いのは？",choices:["没关系。","不用袋子。","加油。","我会。"],answer:0,explain:"謝罪への返答では「没关系」などが使えます。同じ「大丈夫です」でも、申し出を断る場合とは訳が変わります。",entry:"daijoubu"},

 "ピンインの読み方と四声":{focus:"拼音は中国語の発音を記すローマ字表記です。アルファベットを日本語や英語の読み方で当てず、声母・韻母・声調の組み合わせで確認します。",rows:[["声母","m / n / zh","音節のはじめの子音"],["韻母","a / ai / ang","母音を中心とする部分"],["声調","mā / má / mǎ / mà","音節の高さの型"]],tip:"拼音のつづりと日本語の仮名は一対一対応しません。聞いて区別し、声調を含む音節単位で練習します。"},
 "中国語の語順と基本文":{focus:"基本的な中国語文では、主語のあとに動詞や述語が続きます。日本語の助詞による関係表示とは異なり、語順が文の解釈に大きく関わります。",rows:[["自己紹介","我是学生。","私は学生です。"],["動作","我学习中文。","私は中国語を勉強します。"],["場所","我在学校。","私は学校にいます。"]],tip:"まず主語・述語・目的語を見つけ、時間や場所の成分がどこに置かれているかを確かめましょう。"},
 "疑問文・否定文を作る":{focus:"中国語の疑問文は、文末の「吗」、疑問詞、肯定・否定を並べる形などで作ります。日本語の「か」「の？」をそのまま一語に置き換えません。",rows:[["はい・いいえ疑問","你是学生吗？","あなたは学生ですか。"],["疑問詞","你去哪儿？","どこへ行きますか。"],["否定","我不喝咖啡。","私はコーヒーを飲みません。"]],tip:"疑問詞は通常、尋ねる内容の位置に置かれます。語順を保ったまま意味を確認します。"},
 "自己紹介をしてみよう":{focus:"短い自己紹介では、名前・出身・所属・学習目的などを、相手との場面に合わせて組み合わせます。",rows:[["名前","我叫王凌志。","私は王凌志といいます。"],["出身","我来自中国。","中国から来ました。"],["学習","我在学中文。","中国語を勉強しています。"]],tip:"一文を丸ごと覚えるだけでなく、名前や出身など入れ替えられる部分を確認して、自分の情報で言ってみましょう。"},

function renderSense(s,i,e){return `<div class="sense"><div class="sense-title"><span class="sense-number">${i+1}</span><strong>${s.meaning}</strong><span class="pill">${s.function}</span></div><div class="sense-columns"><div class="sense-box"><small>日本語の例</small><strong>${s.ja}</strong><p>中国語：${s.zh}<br><span style="font-family:'DM Sans',sans-serif">${s.pinyin}</span></p></div><div class="sense-box"><small>${e.lang}「${e.term}」の意味機能と条件</small><strong>${s.target}</strong><p>${s.condition}</p></div></div><div class="note-box">注意：${s.warning}</div></div>`}
function dictionary(){const selected=entries.find(e=>e.id===state.entry);const query=(state.dictQuery||"").trim().toLowerCase().replace(/[～〜]/g,"");let results=entries.filter(e=>{const text=[e.term,e.type,e.summary,...e.tags,...e.senses.flatMap(s=>[s.meaning,s.function,s.target,s.ja,s.zh,s.pinyin])].join(" ").toLowerCase().replace(/[～〜]/g,"");const tagText=[...e.tags,...e.senses.map(s=>s.function)].join(" ");const categoryMatch=state.dictCategory==="all"||(state.dictCategory==="可能"&&["可能","能力","許可"].some(t=>tagText.includes(t)))||(state.dictCategory==="時体"&&["時体","過去","完了","経験","進行","結果状態","変化","実現"].some(t=>tagText.includes(t)))||(state.dictCategory==="会話"&&(/会話/.test(e.type)||["会話","婉曲","安心","断り"].some(t=>tagText.includes(t))));return (!query||text.includes(query))&&categoryMatch});if(state.direction!=="both")results=results.filter(e=>state.direction==="ja"?e.lang==="日本語":e.lang==="中国語");return `${header("双方向対照辞典","日本語・中国語のどちらからでも検索できます。語形全体ではなく、義項・意味機能・文脈条件ごとに対応を確認します。","DICTIONARY / 対照辞典")}

function grammarPage(){const topic=grammar.find(x=>x.id===state.grammarTopic)||grammar[0];state.grammarTopic=topic.id;const modeTitle={function:"意味機能から探す",ja:"日本語形式から探す",zh:"中国語形式から探す"};const directory=state.grammarMode==="function"?grammar.map((g,i)=>`<button class="topic-card ${g.id===topic.id?"active":""}" data-topic="${g.id}"><span class="kicker">TOPIC ${String(i+1).padStart(2,"0")} · ${g.category}</span><strong>${g.title}</strong><p>${g.intro.slice(0,45)}…</p></button>`).join(""):grammarEntrances[state.grammarMode].map(([label,id],i)=>`<button class="topic-card ${id===topic.id?"active":""}" data-topic="${id}"><span class="kicker">${state.grammarMode==="ja"?"日本語形式":"中国語形式"} · ${String(i+1).padStart(2,"0")}</span><strong>${label}</strong><p>${grammar.find(g=>g.id===id).title}の意味・用法と対照条件を見る</p></button>`).join("");return `${header("対照文法","日語形式・中国語形式・共通する意味機能の三つの入口で、複数の文法テーマを学びます。各形式は独立して説明し、対応が成立する範囲だけを関連づけます。","GRAMMAR / 対照文法")}

function shuffleItems(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildGameRound(mode){
 if(mode==="vocab")return shuffleItems(vocab).slice(0,5).map(w=>{const defs=[...new Set(vocab.filter(x=>x.word!==w.word).map(x=>x.ja))],choices=shuffleItems([w.ja,...shuffleItems(defs).slice(0,3)]);return{id:`vocab-${w.word}`,type:"語彙クエスト",question:`「${w.word}」の意味として最も近いものは？`,choices,answer:choices.indexOf(w.ja),explain:`${w.word}（${w.pinyin}）は「${w.ja}」という意味です。HSK ${w.level.replace("HSK ","")}の語彙として確認しましょう。`,entry:w.entry||null}});
 const pool=mode==="grammar"?questions.filter(q=>["文法","時体","双方向対照"].includes(q.type)):questions;
 return shuffleItems(pool.length>=5?pool:questions).slice(0,5).map(q=>({...q,choices:[...q.choices]}));
}

function practicePage(){if(!state.roundQuestions.length)startGame(state.gameMode);if(state.gameFinished)return `${header("ミッションクリア",`${state.gameRoundCorrect} / 5問正解 · ${state.gameRoundXp} XP獲得`,"GAME / 結果")}${gameHud()}<section class="panel game-result"><span class="game-chip">${state.gameMode==="vocab"?"単語クエスト":state.gameMode==="grammar"?"文法チャレンジ":"日中クイズ"}</span><h2>${state.gameRoundCorrect>=4?"すばらしい！":"チャレンジ完了！"}</h2><div class="score">${state.gameRoundCorrect} / 5</div><p>正解を重ねて、語彙・文法の経験値をためましょう。</p><div class="detail-actions" style="justify-content:center"><button class="btn" data-game-restart>もう一度プレイ</button><button class="btn btn-outline" data-page="mypage">学習記録を見る</button></div></section>${gameModeButtons()}`;const qs=state.roundQuestions,qi=Math.min(state.questionIndex,qs.length-1),q=qs[qi];return `${header("学習ゲーム","5問のミッションに挑戦。正解するとXPがたまり、連続正解でコンボボーナスがつきます。","GAME / 学習クエスト")}${gameHud()}${gameModeButtons()}<section class="panel"><div class="panel-head"><h3 id="roundCount">${Math.min(state.gameRoundAnswers+1,5)}問目 / 5</h3><span class="game-chip">${state.gameCombo} COMBO</span></div><div class="game-progress"><span style="width:${Math.min(100,state.gameRoundAnswers/5*100)}%"></span></div><p style="font-size:13px;font-weight:700">${q.question}</p><div class="choice-grid">${q.choices.map((c,i)=>`<button class="answer-choice" data-answer="${i}" ${state.answered?"disabled":""}>${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><div class="feedback" id="feedback">${state.answered?"回答済みです。次の問題へ進みましょう。":"選んで回答すると、意味の解説とXPが表示されます。"}</div><div class="detail-actions"><button class="btn" id="nextQuestion">${state.answered?(state.gameRoundAnswers>=5?"結果を見る →":"次の問題 →"):"この問題をスキップ"}</button>${q.entry?`<button class="btn btn-small btn-outline" data-entryid="${q.entry}">関連項目を見る</button>`:""}<span class="pill">今回 ${state.gameRoundXp} XP</span></div></section>`}
